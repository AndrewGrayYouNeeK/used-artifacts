name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ua
          POSTGRES_PASSWORD: ua
          POSTGRES_DB: used_artifacts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ua"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ua:ua@localhost:5432/used_artifacts_test
      TEST_DATABASE_URL: postgresql://ua:ua@localhost:5432/used_artifacts_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - name: Migrations match schema.prisma
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run build
